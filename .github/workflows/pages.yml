# GitHub Pages for the Atlas and the study pages (T-037, design/025-*).
# Manual trigger only: the site is published when a maintainer runs this workflow after enabling
# Pages (Settings -> Pages -> Source: GitHub Actions). It builds from committed files only and
# downloads no data.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package's import dependencies (no data is fetched)
        run: pip install --quiet numpy pandas requests platformdirs
      - name: Build the site and check its links
        run: python -c "from pathlib import Path; from astrolab import site; d = Path('_site'); r = site.build(d); bad = site.broken_links(d); print(r['files'], 'files'); assert not bad, bad"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

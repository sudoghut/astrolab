id: gwtc4-bbh-mass-spectrum
title: "Binary black hole mass spectrum features (GWTC-4.0)"
title_zh: "双黑洞质量谱的特征（GWTC-4.0）"
statement: >
  The BBH primary-mass distribution steepens above ~35 Msun with overdensities
  near ~10 and ~35 Msun (and a possible ~20 Msun feature); GW231123 lies in or
  across the pair-instability gap.
statement_zh: "双黑洞（BBH）主星质量分布在约 35 M☉ 以上变陡，在约 10 和约 35 M☉ 处存在过密峰（并可能在约 20 M☉ 处有特征）；GW231123 落在对不稳定性质量间隙之内或跨越该间隙。"
level: X
grade: established
sources:
  - cite: "LVK 2025, GWTC-4.0 population, ApJL 1005, L51"
    arxiv: "2508.18083"
  - cite: "LVK 2025, GW231123, ApJL 993, L25"
    arxiv: "2507.08219"
reproduction:
  status: partial
  study: 007-m10-gwtc4-bbh-mass-35msun
  quantities:
    - {name: "BBH local merger rate", paper: "14-26 Gpc^-3 yr^-1 at z = 0", ours: null}
    - {name: "BBH sample (FAR < 1/yr, both m 90% lower bounds > 3 Msun)", paper: "153 = 84 O4a + 69 O1-O3", ours: "84 O4a exactly; 59 O1-O3 by the registered rule (the GWTC-2.1 rows of the ten O1/O2 BBHs carry no FAR on GWOSC); 69 and 153 post hoc with their GWTC-1 FARs"}
    - {name: "GW231123 total mass rank in the sample", paper: "most massive BBH to date", ours: "236 Msun median, heaviest of 143 (153 post hoc)"}
open_questions:
  - "Robustness of the 35 Msun feature to pairing-function choices, using released summaries only."
notes: "Milestone M10. The population data release is 35 GB; use only the small files and the GWOSC event table. The ~20 Msun feature is only a hint."

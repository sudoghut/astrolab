id: wide-binary-gravity-test
title: "Wide binaries as a test of gravity at low acceleration"
title_zh: "用宽双星检验低加速度下的引力"
statement: >
  Gaia DR3 wide-binary relative velocities test MOND vs Newton below a0; large
  clean samples favour Newtonian gravity, while small high-precision samples
  are claimed to show a MOND-like boost.
statement_zh: "Gaia DR3 宽双星的相对速度可在加速度低于 a0 时检验 MOND 与牛顿引力；大而干净的样本支持牛顿引力，而有研究声称小的高精度样本显示出类 MOND 的增强。"
level: L4
grade: contested
sources:
  - cite: "Chae 2023, ApJ 952, 128"
    arxiv: "2305.04613"
  - cite: "Banik et al. 2024, MNRAS 527, 4573"
    arxiv: "2311.03436"
  - cite: "Cookson, Banik, El-Badry et al. 2026, MNRAS"
    arxiv: "2602.24035"
reproduction:
  status: partial
  study: 004-m07-wide-binaries-gravity-test
  quantities:
    - {name: "C26 main sample size (v~ <= 2.5)", paper: "1421", ours: "639 (different sample)"}
    - {name: "C26 Newtonian normalisation", paper: "0.489", ours: "0.499"}
    - {name: "C26 likelihood ratio Newton/MOND", paper: "up to ~1500 (MAD/sqrt(N) errors)", ours: "0.49 with bootstrap errors (cannot distinguish; referee, post hoc: no power, flat data would give 6.2); 1.7e-5 with MAD/sqrt(N)"}
    - {name: "alpha_grav (Banik 2024)", paper: "-0.021 +0.065/-0.045", ours: null}
    - {name: "g_obs/g_N (Chae 2023)", paper: "1.43 +/- 0.06", ours: null}
open_questions:
  - "Blind quality-ladder reanalysis reproducing both groups' cuts in one pipeline."
  - "Hidden close binaries flagged with DR4 epoch astrometry."
  - "Study 004 R5 (2026-11-18, pre-registered power gate): the enlarged d < 250 pc design was not run because its velocity-free power gate failed (L_N* 68 < 100); the relaxed degrouping rule keeps 44% of pairs at 130 pc but 23% at 250 pc (pointing to chance neighbours, referee post hoc; direct test T-043). A degrouping rule that scales with distance (chance-alignment rate, T-043) is open."
notes: "Milestone M7. Do not download the 1.8 GB El-Badry catalog; rebuild the sample server-side. Study 004 (2026-11-16): the server-side rebuild of C26's sample gives 639 pairs (C26 1421); with bootstrap errors the test cannot distinguish Newton from MOND and had no power; with C26's MAD/sqrt(N) errors the same data favour MOND, so the error model decides. Post hoc: C26's lowest x bin needs pairs below 1 kAU; with a 300 AU floor the result swings by orders of magnitude with the HR cut and degrouping (re-test T-034)."

id: hubble-tension
title: "Hubble tension: local distance ladder vs early universe"
title_zh: "哈勃张力：本地距离阶梯与早期宇宙"
statement: >
  Cepheid-calibrated distance-ladder H0 (~73 km/s/Mpc) exceeds the CMB-inferred
  LCDM value (~67-68) at >5 sigma; TRGB/JAGB calibrations (CCHP) give ~70.
statement_zh: "造父变星定标的距离阶梯给出的 H0（约 73 km/s/Mpc）高于 CMB 推断的 ΛCDM 值（约 67–68），差异显著性超过 5σ；TRGB/JAGB 定标（CCHP）给出约 70。"
level: L2
grade: tension
sources:
  - cite: "Riess et al. 2022, ApJL (SH0ES)"
    arxiv: "2112.04510"
  - cite: "Freedman et al. 2025, ApJ 985, 182 (CCHP)"
    arxiv: "2408.06153"
  - cite: "Riess et al. 2024/25, JWST validates HST distances"
    arxiv: "2408.11770"
reproduction:
  status: partial
  study: 003-m02-hubble-tension-distance-ladder
  quantities:
    - {name: "H0 SH0ES 2022 (GLS of the public matrices)", paper: "73.04 +/- 1.01 (fit)", ours: "73.04 +/- 1.01 (5 log H0 9.3179 +/- 0.0299)"}
    - {name: "H0 shift, NGC 4258 only: 37 hosts -> 10 CCHP hosts (5 log H0)", paper: "-0.0405 (72.54 -> 71.2, 2024 data)", ours: "-0.0730 +/- 0.0331 (amended host labelling)"}
    - {name: "H0 CCHP TRGB, 11 JWST calibrators, Pantheon+", paper: "69.29", ours: "69.70 (same hosts in the R22 GLS)"}
    - {name: "Same host shift with a host-level random effect (REML tau 0.077 mag; 5 log H0)", paper: "-0.0405 (significant)", ours: "-0.0618 +/- 0.0404 (z = -1.53): no host-selection effect detected (R2-RE, pre-registered 2026-11-16)"}
    - {name: "H0 CCHP TRGB", paper: "70.39 +/- 1.22 (stat) +/- 1.33 (sys)", ours: null, verified: S}
open_questions:
  - "Is the CCHP-SH0ES difference a calibrator-host selection effect? (Study 003, post-data host labelling: in R22's data the CCHP hosts lower H0 by 0.073 +/- 0.033 mag in 5 log H0, and on those hosts Cepheids and TRGB agree to 0.01 mag; the host labelling was amended after the first run. The 2.2 sigma uses C-propagated errors; random 10-host subsets show 1.33 times more scatter, placing the CCHP set at the 4.7th-5.7th percentile, about 1.7 sigma empirically (the subset spread is itself uncertain), where the pre-registered table would read no significant effect.) Update 2026-11-16 (R2-RE, pre-registered): with a host-level random effect the shift is -0.062 +/- 0.040 mag (1.5 sigma), not detected; robustness to single hosts open (T-032). Update 2026-11-18 (R2-RE-ROB, pre-registered): the null is sensitive to one host, N5584 (without it tau 0.031, and the full-data host step under that tau gives z' -2.04); tau not clearly unusual under the null (p = 0.07), the 1.33 random-subset spread is (p = 0.02); referee (post hoc, verified with an approximate check): N5584 (SN 2007af) carries all three signals, and without its rows the host shift is not detected under either covariance (z -1.63, -1.50); explicit treatment registered as T-039."
notes: "Milestone M2. Study 003 R2-RE (2026-11-16): with a host-level random effect estimated by REML (0.077 mag), the CCHP host shift is 1.5 sigma and the pre-registered table gives no host-selection effect detected; the random effect removes the excess random-subset scatter (spread 1.33 -> 1.005)."

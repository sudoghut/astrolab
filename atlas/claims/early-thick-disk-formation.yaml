id: early-thick-disk-formation
title: "The Milky Way's thick disk began forming ~13 Gyr ago"
title_zh: "银河系厚盘约 13 Gyr 前开始形成"
statement: >
  Precise ages of ~250,000 subgiants (LAMOST x Gaia) show the old disk started
  forming ~13 Gyr ago, ~2 Gyr before the inner halo finished assembling, with a
  star-formation peak ~11 Gyr ago around the Gaia-Sausage-Enceladus merger.
statement_zh: "约 25 万颗亚巨星（LAMOST × Gaia）的精确年龄表明，老年盘约 13 Gyr 前开始形成，比内晕完成组装早约 2 Gyr；恒星形成峰值约在 11 Gyr 前，与盖亚-香肠-恩克拉多斯（Gaia-Sausage-Enceladus）并合同期。"
level: L3
grade: established
sources:
  - cite: "Xiang & Rix 2022, Nature 603, 599"
    arxiv: "2203.12110"
reproduction:
  status: partial
  study: 010-m05-thick-disc-subgiant-ages
  quantities:
    - {name: "thick disk onset (mean age of the oldest bin)", paper: "~13 Gyr ago (13.03)", ours: "12.93 +- 0.06 Gyr (observed ages; deconvolved 12.19-12.59)"}
    - {name: "star-formation peak (high-J_phi early stars)", paper: "~11 Gyr ago", ours: "observed-age peak 11.1 Gyr (no volume correction)"}
    - {name: "old-disc sequence span over 1.5 dex", paper: "5-6 Gyr", ours: "6.09 Gyr (R3-SEL reproduced, robust; selection-term sensitive; T-031)"}
    - {name: "intrinsic age scatter of the old sequence", paper: "0.82 Gyr", ours: "0.748 Gyr, SE 0.0098 (intrinsic-SEL confirmed < 0.82, not robust to f = 0.8; T-031)"}
open_questions:
  - "Robustness of the onset epoch to the isochrone grid."
notes: "Milestone M5. Updated catalog: 320,028 subgiants (NADC DOI 10.12149/101467); download only the needed columns. Study 010 (2026-11-16, published 247,104-row table): the 13 Gyr mean is reproduced on the catalogue's own age scale (12.93 Gyr), but the age-scale envelope (0.7-1.1 Gyr in quadrature) is comparable to the 0.87 Gyr margin to the Big Bang and a re-analysis 1.7 Gyr younger exceeds it; the 8 Gyr split and the old-disc sequence (span, 0.82 Gyr scatter) could not be determined, because the S15 selection term of our deconvolution is misspecified (referee, post hoc; re-test T-031). Re-test with a consistent selection term (T-031, 2026-11-20; pre-registered README 2.5; the original labels stand as the pre-registered outcome, these are the current reading): R1-SEL undetermined (robust; selection-term sensitive; it hinges on one bin whose power is limited by mock fits; diagnostic T-045, post hoc: the missed mocks are local optima of the mock fits, and with data-independent starts the bin's power is 1.00, so R1-SEL would read not reproduced if the null mocks and other bins hold up under the same refit, not tested; pre-registered rerun T-049); R3-SEL reproduced, robust (span 6.09 Gyr); R4-SEL not reproduced (sigma_sel 2.55 Gyr vs 0.82); intrinsic-SEL confirmed, not robust (sigma_int 0.748 Gyr; holds only for an error scale f >~ 0.83); R3/R4 selection-term sensitive because the no-term variant fails recovery. Lean: three gaps (bin identification, absolute scale, mean as onset)."

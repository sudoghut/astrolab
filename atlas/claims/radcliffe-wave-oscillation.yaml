id: radcliffe-wave-oscillation
title: "The Radcliffe Wave oscillates as a travelling wave"
title_zh: "Radcliffe 波作为行波在振荡"
statement: >
  The young clusters along the Radcliffe Wave follow a damped sine wave in position and vertical
  velocity, oscillating about the Galactic plane like a travelling wave (mixing parameter B = 0.84
  +0.07/-0.06 when free; B = 1 adopted); the fit constrains the local midplane density.
statement_zh: "沿 Radcliffe 波的年轻星团在位置与竖直速度上都符合阻尼正弦波，像行波一样绕银道面振荡（混合参数 B 自由时为 0.84 +0.07/−0.06，采用 B = 1）；拟合约束了太阳附近银盘中平面的密度。"
level: L3
grade: contested
sources:
  - cite: "Konietzka et al. 2024, Nature 628, 62"
    arxiv: "2402.12596"
  - cite: "Zhu et al. 2024 (non-synchronous oscillations of gas and stars)"
    arxiv: "2402.15346"
reproduction:
  status: partial
  study: 011-m11-radcliffe-wave-oscillation
  quantities:
    - {name: "B with omega0 t free (Extended Data Table 2, column 5)", paper: "0.84 +0.07/-0.06", ours: "0.84 (0.78-0.91)"}
    - {name: "cluster fit, column 4 (6 shape parameters)", paper: "A 217, p 4752, delta 624, s0 673, gamma 1.40, phi -0.23", ours: "3 of 6 inside K24's 16-84% (A 214, delta 605, gamma 1.44); p 4420, s0 490, phi 0.14 outside; clouds-only and column-6 fits not reproduced"}
    - {name: "standing wave (B = 0.5) against B free", paper: "travelling preferred (Delta lnZ about 1)", ours: "excluded in the main fit (2 dlnL 20.2, calibrated p 0.033, p_boot 0.0099) but fragile: 9 of 15 robustness variants change a label (2 dlnL 1.2 without the Orion region)"}
    - {name: "omega0 (column 7)", paper: "67.7 +7.7/-7.1 km/s/kpc", ours: "71 +10/-8 with the v_z divisor fixed at 74 (K24's priors; T8-P, post hoc: 59 +12/-10 under broad priors, prior-driven); the free-divisor fit is withdrawn (likelihood ill-posed in omega0)"}
open_questions:
  - "Why does no baseline convention reproduce K24's clouds-only fit (column 3)? All 16 tested give the same two of six inside (T-056, post hoc); the origin of s, a z offset and the cloud sample are untested (T-061)."
notes: "Milestone M11. Study 011 overall reading 'mixed' (2026-11-21): phase spread (T4, power 0.41) and the model-free b-hat (T5, known-answer check failed) undetermined; the 12CO velocities fit the B = 1 model worst of three versions (the pre-registered rule has one direction: 'does not distinguish'). Post hoc (T-056, 2026-11-22): R-CONV, none of 16 baseline, sigma and weight conventions reproduces the clouds-only column (3) (count 2 of 6 in every one; the cause is common to all); T8-P with the divisor fixed at 74: prior-driven, under broad priors the data prefer omega0 = 59 (+12/-10) km/s/kpc about as tightly as K24's prior, which pulls it to 71 (K24 67.7)."

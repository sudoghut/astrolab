id: s8-tension
title: "S8 tension between weak lensing and the CMB"
title_zh: "弱引力透镜与 CMB 之间的 S8 张力"
statement: >
  Low-redshift probes of clustering amplitude (S8) were lower than the CMB-inferred
  value; by 2025-26 KiDS-Legacy is consistent with the CMB while DES Y6 remains ~2.6 sigma low.
statement_zh: "低红移的成团幅度（S8）探针曾低于 CMB 推断值；到 2025–26 年，KiDS-Legacy 已与 CMB 一致，而 DES Y6 仍偏低约 2.6σ。"
level: L0
grade: contested
sources:
  - cite: "Wright et al. 2025, A&A 703, A158 (KiDS-Legacy)"
    arxiv: "2503.19441"
  - cite: "DES Collaboration 2026, DES Y6 3x2pt"
    arxiv: "2601.14559"
reproduction:
  status: reproduced
  study: 008-m03-s8-des-y6-cmb-parameter-difference
  quantities:
    - {name: "S8 DES Y6 3x2pt (mean, public chain)", paper: "0.789 +/- 0.012", ours: "0.7893 [0.7777, 0.8019]"}
    - {name: "S8 CMB (Planck+ACT+SPT, D26)", paper: "0.836 +0.012/-0.013", ours: "0.8357 [0.8229, 0.8481]"}
    - {name: "DES Y6 3x2pt - CMB difference in S8", paper: "2.6 sigma", ours: "2.67 +/- 0.03 sigma (bootstrap; 2.44-2.55 with D26's projection-effect shifts)"}
    - {name: "DES Y6 3x2pt - CMB difference in S8-Omega_m", paper: "2.2 sigma", ours: "2.18 +/- 0.03 sigma"}
    - {name: "DES Y6 3x2pt - CMB full-space difference (6 parameters, normalizing flows)", paper: "1.8 sigma", ours: "1.70 sigma mean, 1.61-1.86 over 5 flow trainings (R6 not evaluable: training spread 0.098 > 0.07)"}
    - {name: "Same difference without Sigma m_nu (5 parameters, normalizing flows; R6-NOMNU, pre-registered 2026-11-18)", paper: null, ours: "0.52 sigma (5 trainings, s 0.04): the full-space shift is mainly the Sigma m_nu direction; referee (post hoc): Sigma m_nu jointly with its DES correlations and partly the prior shape (T-044)"}
    - {name: "Fraction of what Sigma m_nu adds that goes with its DES-side correlations (DES Sigma m_nu column shuffled, 6-D flows; R6-SHUF, pre-registered 2026-11-19)", paper: null, ours: "phi = 0.671, I = [0.638, 0.704] (5 paired trainings): mainly through its correlations with the other DES parameters; with DES's Sigma m_nu from its prior the 6-D value (0.55 sigma) is close to the 5-D one; referee (post hoc): gate-bias-corrected I = [0.601, 0.669], near the edge; known-answer test R6-SHUF-KA (T-047, pre-registered): no bias of phi detected on a synthetic family (b = +0.020, I_b = [-0.006, 0.045]), label holds after the correction (I = [0.610, 0.693]); transfer to the data rests on cancellation of per-variant offsets of -0.07 to -0.12 sigma (referee; T-063); R6-SHUF-KA2 (T-063, pre-registered) on a Gaussian-mixture surrogate of the two chains: flows underestimate phi (b = -0.052, I_b = [-0.073, -0.031]), label holds after that correction (I = [0.684, 0.762]); the two known-answer biases differ (delta b = -0.071, 4.3 sigma), so the bias on the data is not determined to better than about +/-0.05-0.07 and the label would be lost if it exceeded about +0.03 (post hoc, referee; edge-preserving surrogate T-068)"}
    - {name: "S8 KiDS-Legacy", paper: "0.815 +0.016/-0.021 (mode); mean 0.813 +/- 0.018", ours: "1.04 sigma from the CMB chain (summary only)", verified: V}
open_questions:
  - "Same-prior, same-S8-definition meta-comparison across probes."
  - "Which DES parameters carry Sigma m_nu's correlation, and does a known-answer test of the shuffle fraction phi recover it within about 0.05? (R6-SHUF, T-044: phi = 0.67, mainly DES-side correlations, near the edge of the calibration; T-047 R6-SHUF-KA: no bias of phi detected on a synthetic family, label holds after the correction; a test on a surrogate of the data's own difference, T-063 R6-SHUF-KA2: flows underestimate phi by 0.052 there, label holds after that correction, but the two biases differ by 4.3 sigma, so the bias on the data is not determined; a surrogate keeping the Sigma m_nu prior edge is T-068.)"
notes: "Milestone M3. Study 008 R6-NOMNU (2026-11-18): most of DES Y6's full-space 1.8 sigma difference from the CMB goes with Sigma m_nu (the CMB chain sits at the 0.06 eV prior edge, DES is close to its prior); R6-SHUF (T-044, 2026-11-20, pre-registered): what Sigma m_nu adds is mainly through its correlations with the other DES parameters (phi = 0.67; about a third from DES's Sigma m_nu marginal against its prior; with DES's Sigma m_nu at its prior about 0.03 sigma remains, not separated between the CMB side, the sixth dimension and residuals; near the edge of the gates' calibration; the known-answer test R6-SHUF-KA, T-047, on a synthetic family detects no bias of phi and the label holds after the correction; on a Gaussian-mixture surrogate of the data, R6-SHUF-KA2, T-063, the flows underestimate phi by 0.052 and the label also holds after that correction, but the two biases differ by 4.3 sigma, so the bias on the data is not determined (post hoc; T-068)); in the other five parameters the difference is 0.5 sigma, in the data-constrained pair (A_s, Omega_m) 0.40 sigma."

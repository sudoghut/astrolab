id: jwst-z14-galaxies
title: "Spectroscopically confirmed galaxies at z ~ 14 and the bright-galaxy excess"
title_zh: "光谱确认的 z ≈ 14 星系与亮星系过剩"
statement: >
  JWST spectroscopy confirms luminous galaxies at z = 14.32 (JADES-GS-z14-0) and
  z = 14.44 (MoM-z14); the bright-end UV luminosity function at z > 10 exceeds
  pre-JWST model predictions.
statement_zh: "JWST 光谱确认了 z = 14.32（JADES-GS-z14-0）和 z = 14.44（MoM-z14）的高光度星系；z > 10 的亮端紫外光度函数超出 JWST 之前的模型预测。"
level: L1
grade: established
sources:
  - cite: "Carniani et al. 2024, Nature 633, 318"
    arxiv: "2405.18485"
  - cite: "Naidu et al. 2026, OJAp 9"
    arxiv: "2505.11263"
  - cite: "Harikane et al. 2025, ApJ"
    arxiv: "2406.18352"
reproduction:
  status: partial
  study: 006-m08-z14-galaxies-number-density
  quantities:
    - {name: "z_spec MoM-z14", paper: "14.44 +/- 0.02", ours: null, verified: V}
    - {name: "log phi, z = 14-15, -21 < M_UV < -20 (N26, two sources)", paper: "-5.36 +0.37/-0.45", ours: "-5.364 +0.365/-0.451 (Gehrels; volume 460,463 Mpc^3)"}
    - {name: "observed / pre-JWST baseline", paper: "182 (+329/-105), N26's S23-type LF", ours: "constant-SFE model calibrated at z ~ 8 predicts 9.4x N26's baseline (2.5-37x across 72 variants), i.e. observed / ours ~ 19"}
    - {name: "sigma_UV needed at z = 14-15", paper: "~1.5-2 mag (N26)", ours: "1.38 mag (1.15-1.57 Poisson; 1.07-1.60 across variants)"}
    - {name: "R2/R3-POST: posterior over the z ~ 8 LF calibration (sensitivity check)", paper: null, ours: "ratio to N26's baseline 7.5-14.2 (16-84%), P(higher) = 1.00; P(sigma_UV overlaps 1.5-2 mag) = 0.962 (0.86-1.00 with sigma_cal)"}
    - {name: "R3-POST2: sigma_cal sampled, Poisson brightest bins, gamma >= -1 (sensitivity check)", paper: null, ours: "P(higher) = 0.99, ratio 5.5-21.7 (16-84%); P(sigma_UV overlaps 1.5-2 mag) = 0.916, calibration-uncertain; sigma_cal prior-dominated (0.43-1.05 mag)"}
open_questions:
  - "Minimal UV burstiness / star-formation efficiency needed at z ~ 12-15."
notes: "Milestone M8. Detection is established; the interpretation of the excess is contested. Study 006: the size of the excess depends strongly on the pre-JWST baseline (calibration-dependent across 72 model variants); the counts are two sources with Poisson errors only (cosmic variance, the effective area and the bin drawn around the detections are open gaps). The referee showed that 1 sigma in phi*, M* or alpha flips the sigma_UV verdict (phi* -1 sigma also brings the model within 3x of N26's baseline), and that a z ~ 8 dust correction raises the ratio and flips the sigma_UV verdict. T-025 (2026-11-16, pre-registered posterior calibration on binned z ~ 8 LF data): the excess over N26's baseline is robust to the LF calibration uncertainty (P(higher) >= 0.994 in all four fits; ratio 16-84% 7.5-14.2 in the primary fit), while the sigma_UV overlap with N26 stays borderline (P = 0.96, 0.86-1.00 with sigma_cal); both conditional on the fiducial model ingredients."

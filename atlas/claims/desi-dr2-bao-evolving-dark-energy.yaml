id: desi-dr2-bao-evolving-dark-energy
title: "DESI DR2 BAO: hint of evolving dark energy"
title_zh: "DESI DR2 重子声学振荡：暗能量演化的迹象"
statement: >
  DESI DR2 BAO combined with CMB and type Ia supernovae prefers w0waCDM
  (w0 > -1, wa < 0) over LambdaCDM at 2.8-4.2 sigma depending on the SN sample.
statement_zh: "DESI DR2 重子声学振荡（BAO）数据与宇宙微波背景（CMB）和 Ia 型超新星结合后，相对 ΛCDM 更偏好 w0waCDM（w0 > -1，wa < 0），显著性为 2.8–4.2σ，取决于所用的超新星样本。"
level: L0
grade: hint
sources:
  - cite: "DESI Collaboration (Abdul-Karim et al.) 2025, PRD 112, 083515"
    arxiv: "2503.14738"
  - cite: "DESI Collaboration 2025 (DR1), JCAP 02 (2025) 021"
    arxiv: "2404.03002"
reproduction:
  status: partial
  study: 002-m01-desi-bao-evolving-dark-energy
  quantities:
    - {name: "Omega_m (BAO only, LCDM)", paper: "0.2975 +/- 0.0086", ours: "0.2979 +/- 0.0086"}
    - {name: "h r_d (BAO only, LCDM)", paper: "101.54 +/- 0.73", ours: "101.52 +/- 0.73", unit: Mpc}
    - {name: "Delta chi2_MAP, DESI + compressed CMB prior", paper: "-8.0 (2.4 sigma)", ours: "-8.01 (reading B, omega_bc = omega_b + omega_c); -6.59 (reading A, with omega_nu)"}
    - {name: "Delta chi2_MAP, DESI alone / + Pantheon+ / + Union3", paper: "-4.7 / -4.9 / -10.1", ours: "-4.65 / -4.86 / -10.03"}
    - {name: "w0, wa (DESI + compressed CMB prior)", paper: "-0.43 +/- 0.22, -1.72 +/- 0.64", ours: "-0.44 +/- 0.23, -1.69 +/- 0.66 (reading B); -0.48 +/- 0.23, -1.55 +/- 0.66 (reading A)"}
    - {name: "w0 (DESI+CMB+DES-SN5YR)", paper: "-0.752 +/- 0.057", ours: null}
    - {name: "wa (DESI+CMB+DES-SN5YR)", paper: "-0.86 +0.23/-0.20", ours: null}
    - {name: "preference over LCDM (DESI+CMB+DES-SN5YR)", paper: "4.2 sigma", ours: null}
depends_on: []
updates:
  - "2026: DES-Dovekie SN recalibration lowers the DES-SN combination from 4.2 to ~3.2 sigma (Popovic et al., arXiv:2511.07517)."
  - "2026-07: DESI DR2 Lya full-shape gives 2.7 sigma (DESI+CMB) and 3.2 sigma (with SNe) (arXiv:2607.27410)."
open_questions:
  - "How much of the preference comes from the w0-wa parametrisation versus binned w(z) or Gaussian-process reconstructions?"
  - "Leave-one-tracer-out and leave-one-SN-sample-out sensitivity of the signal."
notes: "Verified against arXiv abstracts in plan 002 (cosmology agent report, 2026-11-11). Milestone M1. Study 002 (2026-11-14): BAO-only and no-CMB rows reproduced, compressed-CMB row conditionally reproduced; full-CMB and DES-SN5YR rows are out of scope (full Planck/ACT likelihoods; 53.5 MB covariance above the download limit). The compressed prior reproduces only when its omega_bc mean is read as omega_b + omega_c."

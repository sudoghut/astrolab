id: nanohertz-gw-background
title: "Nanohertz gravitational-wave background from pulsar timing arrays"
title_zh: "脉冲星计时阵列探测到的纳赫兹引力波背景"
statement: >
  NANOGrav, EPTA, PPTA and CPTA find a common red process with Hellings-Downs
  correlations at ~2-4.6 sigma, consistent with a GW background of amplitude
  ~2.4e-15 at f = 1/yr.
statement_zh: "NANOGrav、EPTA、PPTA 和 CPTA 发现了具有 Hellings-Downs 相关性的共同红噪声过程，显著性约 2–4.6σ，与 f = 1/yr 处振幅约 2.4×10⁻¹⁵ 的引力波背景一致。"
level: X
grade: hint
sources:
  - cite: "Agazie et al. 2023, ApJL 951, L8 (NANOGrav 15-yr)"
    arxiv: "2306.16213"
  - cite: "Antoniadis et al. 2023, A&A 678, A50 (EPTA DR2)"
    arxiv: "2306.16214"
reproduction:
  status: partial
  study: 005-m09-nanograv-gwb-power-law
  quantities:
    - {name: "A_GWB at gamma = 13/3 (NANOGrav, KDE refit v2.0.0, fiducial DMX noise model, median and 90%)", paper: "2.4 +0.7/-0.6 e-15", ours: "2.31 [1.82, 2.92] e-15 (Hellinger 0.099 to L8's interval)"}
    - {name: "gamma, free power law (fiducial DMX noise model)", paper: "3.2 +/- 0.6 (5-95%)", ours: "3.25 [2.65, 3.89]"}
    - {name: "HPD level of gamma = 13/3 (2-D, fiducial DMX noise model)", paper: "within the 99% region", ours: "0.979 (factorised likelihood)"}
    - {name: "Hellings-Downs significance", paper: "Bayes factor 200-1000", ours: null, verified: S}
open_questions:
  - "Is the SMBHB amplitude consistent with galaxy-merger and BH mass-function priors?"
notes: "Milestone M9. Grade 'hint' here means strong evidence below 5 sigma. Study 005 refits the NANOGrav KDE free spectrum (Zenodo 21844115 v2.0.0; v1.1.0 = Zenodo 10344086 as a post-hoc comparison). The HD significance is not reproduced (needs the full timing data). The agreement is conditional on L8's fiducial DMX noise model: on the DMGP free spectrum (v1.1.0) the refit gives A = 2.19e-15 (Hellinger 0.31 to L8's interval) and the HPD level of gamma = 13/3 falls to 0.62 (study 005, post hoc)."

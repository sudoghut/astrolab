question: "Does the published LAMOST/Gaia subgiant age catalogue of Xiang & Rix 2022 reproduce its thick-disc onset at about 13 Gyr, the split of the age-metallicity plane at 8 Gyr and the tight old-disc age-metallicity sequence, and how much of each depends on the absolute age scale, the error model and the sample selection?"

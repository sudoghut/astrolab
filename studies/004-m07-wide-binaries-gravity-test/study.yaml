question: "In a clean Gaia DR3 wide-binary sample rebuilt server-side to the quality standard of Cookson et al. 2026, does the median scaled relative velocity stay flat with r_sky/r_M (Newton) or rise by ~20% beyond the MOND radius?"
question_zh: "在按 Cookson 等 2026 的质量标准、于服务器端重建的干净 Gaia DR3 宽双星样本中，缩放相对速度的中位数随 r_sky/r_M 保持平坦（牛顿），还是在 MOND 半径以外升高约 20%？"

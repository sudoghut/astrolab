created: 2026-11-21
question: "Does the public Gaia XP metallicity sample of Rix et al. 2022 reproduce their numbers for the metal-poor stars near the Galactic Centre (about 18,000 stars with -2.7 < [M/H] < -1.5, a Gaussian extent of about 2.7 kpc, no net rotation below [M/H] = -2 and rotation-dominated orbits near -1), and how sensitive are these numbers to the sample choices and metallicity errors?"
question_zh: "用 Rix 等 2022 公开的 Gaia XP 金属丰度样本，能否复现他们对银心附近贫金属星给出的数字（约 18,000 颗 −2.7 < [M/H] < −1.5 的星、约 2.7 kpc 的高斯尺度、[M/H] < −2 时无净转动而 [M/H] 约 −1 时以转动为主），这些数字对样本选择与金属丰度误差有多敏感？"
